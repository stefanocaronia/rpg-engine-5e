# --- Exhaustion, conditions and speed effects ----------------------------------------------------------------------------------------------------------

- id: exhaustion-2-small-halfling
  title: A lightfoot halfling rogue at exhaustion 2, half of 25 feet kept exact; a Small creature carries and pushes as a Medium one
  source: "SRD 5.1 p. 358 (Exhaustion 2: speed halved); pp. 4-5 (Halfling: Small, speed 25); p. 80 (Size and Strength); p. 85 (Jumping; Suffocating, minimum 30 seconds)"
  write:
    creature: "[[Lightfoot Halfling]]"
    classes: "[[Rogue]] 1"
    str: 8
    dex: 16
    con: 8
    int: 10
    wis: 12
    cha: 12
    hp-base: 8
  change:
    exhaustion: 2
  expect:
    walking: "12.5 ft"
    push-drag: "240 lb"
    long-jump: "8 ft"
    high-jump: "2 ft"
    # Minutes: 1 + Con modifier is 0, so the minimum of 30 seconds.
    hold-breath: "30s"
    hp: "7/7"
    sneak-attack: "1d6"

- id: exhaustion-4-hit-points
  title: Exhaustion 4 halves the hit point maximum, and the current hit points cannot stay above it
  source: "SRD 5.1 p. 358 (Exhaustion 4: hit point maximum halved; levels are cumulative, so speed halved too); p. 96 (current hit points from the maximum down to 0)"
  write:
    creature: "[[Human]]"
    classes: "[[Fighter]] 1"
    str: 14
    dex: 12
    con: 14
    int: 10
    wis: 10
    cha: 10
    hp-base: 10
  change:
    exhaustion: 4
  expect:
    hp: "6/6"
    walking: "15 ft"

- id: exhaustion-5-haste
  title: Exhaustion 5 stops a hasted character
  source: "SRD 5.1 p. 358 (Exhaustion 5: speed reduced to 0); p. 153 (Haste)"
  write:
    creature: "[[Human]]"
    classes: "[[Fighter]] 1"
    str: 14
    dex: 12
    con: 14
    int: 10
    wis: 10
    cha: 10
    hp-base: 10
  effects:
    - name: Haste
      set: {speed-factor: 2}
  change:
    exhaustion: 5
  expect:
    walking: "0 ft"

- id: grappled-longstrider
  title: Grappled stops a character, and no bonus to the speed counts
  source: "SRD 5.1 p. 358 (Grappled: speed becomes 0, can't benefit from any bonus to its speed); p. 160 (Longstrider)"
  write:
    creature: "[[Human]]"
    classes: "[[Fighter]] 1"
    str: 14
    dex: 12
    con: 14
    int: 10
    wis: 10
    cha: 10
    hp-base: 10
  effects:
    - name: Longstrider
      set: {bonus-speed: 10}
    - name: Grappled
  expect:
    walking: "0 ft"

- id: haste-slow-barbarian
  title: Haste and Slow together on a barbarian with Fast Movement, doubled and halved, +2 and -2 AC
  source: "SRD 5.1 p. 153 (Haste: speed doubled, +2 AC); pp. 180-181 (Slow: speed halved, -2 AC); p. 104 (Combining Magical Effects: different spells add together); p. 9 (Fast Movement)"
  write:
    creature: "[[Human]]"
    classes: "[[Barbarian]] 5"
    str: 16
    dex: 14
    con: 16
    int: 8
    wis: 12
    cha: 10
    hp-base: 40
  effects:
    - name: Haste
      set: {speed-factor: 2, bonus-ac: 2}
    - name: Slow
      set: {speed-factor: 0.5, bonus-ac: -2}
  expect:
    walking: "40 ft"
    ac: "15"

# out: What the suite leaves out, and why.
# out: Barbarian 20, Rages "Unlimited" (p. 9): the column is a word, not a maximum; and Primal Champion's +4 Str and Con, up to 24, is in the scores the master writes.
# out: Druid 20, Archdruid (p. 21): unlimited Wild Shape; the counter's formula gives 0, and "unlimited" is no number a counter holds. Text for the AI.
# out: Remarkable Athlete adds the Strength modifier to a running long jump (p. 25), Second-Story Work the Dexterity modifier to a running jump (p. 41): long-jump reads only Str, so the champion and the thief would fail; per D-230 this is a line of text, not a formula, until a playtest asks.
# out: A monk with a shield or armor keeps the Dex and the Martial Arts die on the unarmed strike on the sheet, though Martial Arts needs neither (p. 26): the system leaves it to the AI (sheet-notes, Attacks), so no attack is checked in monk-6-shield.
# out: The order of sums and factors (Haste with Longstrider or Fast Movement): the SRD 5.1 gives none (p. 153 doubles "your speed", p. 160 adds 10), so only factors that make x1, or factors on a speed without bonuses, are checked.
# out: A paladin and a ranger both at odd levels (3/3): "half your levels (rounded down) in the paladin and ranger classes" (p. 58) reads per class (1 + 1) or on the sum (3); the system takes the sum. paladin-6-ranger-2 is a case where both readings give 4.
# out: Exhaustion 4 on an odd maximum: the SRD 5.1 has no general rule to round down (it is in the Player's Handbook introduction, not in the SRD), so exhaustion-4 uses an even maximum.
# out: The current hit points when an Amulet of Health raises the maximum: the SRD says nothing (Aid says it for itself, p. 114); amulet-of-health checks no hp.
# out: The sheet's rolls with advantage or disadvantage (sheet-odds): Stealth in chain mail (p. 63), heavily encumbered (p. 80), exhaustion 1 and 3, Poisoned, Restrained (p. 358). The format has no place for a roll's notation; with a key such as rolls: {stealth: "2d20kl1+0"} they would come in, read from view --json.
# out: Slow's -2 to Dexterity saving throws (p. 181) and Haste's advantage on them: no field adds to one save alone; text for the AI.
# out: Bracers of Defense (+2 AC with no armor and no shield, p. 212): the page has no bonus, and a fixed bonus-ac would be wrong with a shield; text for the AI.
# out: Under the rigor simulation, whether the thresholds Str x 5 and Str x 10 double with size (p. 80 names only capacity and push): no Small or Large case under simulation.
# out: Under the rigor rules, past Str x 30 a character cannot move the weight at all (p. 80); the system caps at 5 feet. No case past twice the capacity.
# out: Columns of a class table in a multiclass, as cantrips-known for a ranger 4/wizard 3: how two classes' columns show together is not one the rules decide; checked only on single classes.
# out: Rage itself changes no number on the sheet beyond rage-damage (resistances and advantage on Str checks are text, p. 8).
