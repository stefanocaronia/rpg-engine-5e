  source: "SRD 5.1 p. 52 (Wizard table, whose 20th row says Signature Spell); p. 54 (Signature Spells: two, each once at 3rd level, back with a short or long rest)"
  write:
    creature: "[[Human]]"
    classes: "[[Wizard]] 20"
    str: 8
    dex: 14
    con: 14
    int: 20
    wis: 12
    cha: 10
    hp-base: 82
  add:
    subclasses: ["[[School of Evocation]]"]
    save-proficiencies: [int, wis]
  expect:
    proficiency: "+6"
    caster-level: "20"
    slots-1: "4/4"
    slots-2: "3/3"
    slots-3: "3/3"
    slots-4: "3/3"
    slots-5: "3/3"
    slots-6: "2/2"
    slots-7: "2/2"
    slots-8: "1/1"
    slots-9: "1/1"
    max-prepared: "25"
    spell-save-dc: "19"
    spell-attack: "+11"
    signature-spell-1: "1/1"
    signature-spell-2: "1/1"
    arcane-recovery: "1/1"
    cantrips-known: "5"
    int-save: "+11"

- id: wizard-5-protection
  title: A level 5 wizard with Mage Armor, attuned to a ring and a cloak of protection, which add up on AC and every save but not on the save DC
  source: "SRD 5.1 p. 160 (Mage Armor: base AC 13 + Dex); p. 237 (Ring of Protection); p. 214 (Cloak of Protection); p. 206 (Attunement)"
  write:
    creature: "[[Human]]"
    classes: "[[Wizard]] 5"
    str: 10
    dex: 14
    con: 14
    int: 16
    wis: 12
    cha: 10
    hp-base: 22
  add:
    save-proficiencies: [int, wis]
    inventory: ["[[Ring of Protection]]", "[[Cloak of Protection]]"]
    attuned: ["[[Ring of Protection]]", "[[Cloak of Protection]]"]
  effects:
    - name: Mage Armor
      set: {unarmored-base: 13}
  expect:
    ac: "17"
    int-save: "+8"
    wis-save: "+6"
    dex-save: "+4"
    str-save: "+2"
    spell-save-dc: "14"
    spell-attack: "+6"
    max-prepared: "8"
    slots-1: "4/4"
    slots-2: "3/3"
    slots-3: "2/2"

# --- Attunement that sets a score ----------------------------------------------------------------------------------------------------------------------

- id: gauntlets-weak-fighter-in-plate
  title: Gauntlets of Ogre Power on a fighter with Strength 8 in plate, which then no longer slows him
  source: "SRD 5.1 p. 223 (Gauntlets of Ogre Power: Strength 19); p. 63 (Plate Str 15); p. 85 (Jumping); p. 80 (Push, Drag, or Lift); p. 92 (Unarmed strike: 1 + Str)"
  write:
    creature: "[[Human]]"
    classes: "[[Fighter]] 1"
    str: 8
    dex: 10
    con: 14
    int: 10
    wis: 10
    cha: 10
    hp-base: 10
  add:
    save-proficiencies: [str, con]
    inventory: ["[[Plate Armor]]", "[[Gauntlets of Ogre Power]]"]
    equipped: ["[[Plate Armor]]"]
    attuned: ["[[Gauntlets of Ogre Power]]"]
  expect:
    str-mod: "+4"
    str-save: "+6"
    athletics: "+4"
    long-jump: "19 ft"
    high-jump: "7 ft"
    push-drag: "570 lb"
    walking: "30 ft"
    ac: "18"
    attack: "+6"
    damage-roll: "5 bludgeoning"

