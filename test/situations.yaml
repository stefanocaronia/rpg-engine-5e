# Situations of the 5e (D-449): each a character as the master writes it, and what its sheet must show, with where the rule is.
- id: fighter-1-chain-shield
  title: A level 1 fighter in chain mail with a shield, Defense
  source: "SRD 5.1 pp. 24, 63–64 (Fighting Style, Armor)"
  write:
    creature: "[[Human]]"
    classes: "[[Fighter]] 1"
    str: 16
    dex: 12
    con: 14
    int: 10
    wis: 10
    cha: 10
    hp-base: 10
    fighting-styles: "[Defense]"
    save-proficiencies: "[str, con]"
  add:
    inventory: ["[[Chain Mail]]", "[[Shield]]"]
    equipped: ["[[Chain Mail]]", "[[Shield]]"]
  expect:
    ac: "19"
    proficiency: "+2"
    str-save: "+5"
    walking: "30 ft"
