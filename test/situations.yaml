# --- Bard ----------------------------------------------------------------------------------------------------------------------------------------------

- id: bard-5-lore-jack-of-all-trades
  title: A level 5 bard with expertise, and Jack of All Trades on checks without proficiency, initiative and passives included
  source: "SRD 5.1 pp. 11-13 (Bard table, Bardic Inspiration, Jack of All Trades p. 12, Expertise p. 13); p. 78 (Passive Checks); p. 63 (Leather)"
  write:
    creature: "[[Human]]"
    classes: "[[Bard]] 5"
    str: 10
    dex: 14
    con: 12
    int: 10
    wis: 12
    cha: 16
    hp-base: 28
  add:
    subclasses: ["[[College of Lore]]"]
    save-proficiencies: [dex, cha]
    skill-proficiencies: [Performance, Persuasion, Deception]
    expertise: [Performance, Persuasion]
    inventory: ["[[Leather Armor]]"]
    equipped: ["[[Leather Armor]]"]
  expect:
    proficiency: "+3"
    performance: "+9"
    persuasion: "+9"
    deception: "+6"
    athletics: "+1"
    acrobatics: "+3"
    initiative: "+3"
    passive-perception: "12"
    passive-investigation: "11"
    # Jack of All Trades is for ability checks only, never saving throws.
    wis-save: "+1"
    dex-save: "+5"
    cha-save: "+6"
    ac: "13"
    bardic-inspiration: "3/3"
    caster-level: "5"
    spell-save-dc: "14"
    spell-attack: "+6"
    slots-1: "4/4"
    slots-2: "3/3"
    slots-3: "2/2"
    cantrips-known: "3"
    spells-known: "8"

