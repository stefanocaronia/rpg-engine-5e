# The fifth edition, from the System Reference Document 5.1: see LICENSE.md.
title: the fifth edition from the SRD 5.1, the 2014 rules
language: en
attribution: >-
  This work includes material taken from the System Reference Document 5.1 ("SRD 5.1") by Wizards of the Coast LLC and available at
  https://dnd.wizards.com/resources/systems-reference-document. The SRD 5.1 is licensed under the Creative Commons Attribution 4.0 International License
  available at https://creativecommons.org/licenses/by/4.0/legalcode.
# The coins, as config takes them (Standard Exchange Rates, p. 62): the first counts the totals, a rare one is never given as change.
coins: gp 100, pp 1000 rare, ep 50 rare, sp 10, cp 1
# What each coin is made of (p. 62), as the dashboard draws it.
coin-metals: {pp: platinum, gp: gold, ep: electrum, sp: silver, cp: copper}
# How long a round lasts (p. 84): in a scene with turns, a duration of up to a minute becomes rounds.
round: 6 seconds
# What the game's mile and foot are worth in metric (D-262), as the Italian books count them: the engine keeps every measure in metric, and its outputs in
# imperial give back the SRD's numbers, such as 3 miles an hour for the normal pace.
imperial: {mile: 1.5 km, foot: 0.3 m, pound: 0.5 kg}
# What a character carries (p. 176, Carrying Capacity and Size and Strength; p. 143, coins): the weight of each item, a limit of Strength times 15 by
# size, fifty coins to a pound (D-432, D-435); formulas read them as load and load-limit.
load: {field: weight, limit: ["str * 15 * table(carry-by-size, size)", str * 15], coins: 50}
# The computed lengths, as the speeds, are in feet (SPD-1).
length-unit: ft
# How one travels (TRV-1–TRV-3, TRV-8; Adventuring › Travel Pace and Difficult Terrain): the paces of an hour (4, 3 and 2 miles), 8 hours of travel a day,
# beyond them a forced march; difficult terrain halves a pace. A river or the sea is travelled only in a waterborne vehicle, at its speed, up to 24 hours a
# day; going downstream adds the current, typically 3 miles an hour (Keelboat, Rowboat).
travel:
  paces: {fast: 6 km, normal: 4.5 km, slow: 3 km}
  pace: normal
  hours: 8
  rule: Travel Pace
  beyond: Forced March
  terrain: {difficult: 1/2}
  kinds:
    road: {}
    path: {}
    river: {vehicle: {category: waterborne vehicle}, speed: speed, hours: 24, current: 4.5 km}
    sea: {vehicle: {category: waterborne vehicle}, speed: speed, hours: 24}
# The map of a place (GRD-4, GRD-5; Combat › Movement and Position, Creature Size): a square is 5 feet; a diagonal step counts as one square (D-327);
# difficult terrain costs double. The walking speed is the first value of speed; a creature's space comes from its size, 10 feet for Large, 15 for Huge,
# 20 for Gargantuan. Who leaves the side of another reads Opportunity Attacks.
grid:
  square: 1.5 m
  diagonal: 1
  difficult: 2
  speed: speed
  size: size
  footprints: {Large: 2, Huge: 3, Gargantuan: 4}
  leaving: Opportunity Attacks
  walking: walking
# What the setup asks for this system, with the campaign's settings (DAT-10, D-212): how the characters gain levels, with the experience points of the SRD
# (p. 56), or at the milestones the story reaches, where xp is neither asked nor shown.
settings:
  advancement:
    about: how your character levels up
    xp: {means: "experience points, as the SRD: scene close says those of the creatures overcome, and you give more with change, as you judge, for what the story rewards, to one character or to all", player: "your character levels up with experience points, for the foes overcome and what the story rewards"}
    milestones: {means: "the characters rise when the story reaches a milestone, such as the end of an adventure or a great goal: agree with the player which kind, write it in table, and you say when", player: "your character levels up at the big moments of the story", without: [xp]}
# The character sheet, in groups (D-207, DAT-2): show gives a character so, and Page#Group one group with how each number is made. A field in parentheses
# is shown beside the one before it. Only what the system does not work out (computed, below) is written: status lists it until there is a player character,
# and reminds what a character still lacks; with ? a field written only when it applies, never reminded.
sheet:
  Character: [creature?, size?, classes, subclasses?, background?, feats?, alignment?, factions?, level, xp, inspiration?]
  Personality: [personality-traits?, ideal?, bond?, flaw?]
  Appearance: [age?, height?, weight?, eyes?, skin?, hair?]
  Abilities: [str (str-mod), dex (dex-mod), con (con-mod), int (int-mod), wis (wis-mod), cha (cha-mod), proficiency]
  Saving Throws: [str-save, dex-save, con-save, int-save, wis-save, cha-save, save-notes?]
  Skills: [acrobatics, animal-handling, arcana, athletics, deception, history, insight, intimidation, investigation, medicine, nature, perception, performance, persuasion, religion, sleight-of-hand, stealth, survival]
  Combat: [ac, initiative, walking (speed), flying?, swimming?, climbing?, burrowing?, equipped?, hp-base, hp, temp-hp?, hit-dice-d6?, hit-dice-d8?, hit-dice-d10?, hit-dice-d12?, passive-perception, passive-insight, passive-investigation, darkvision?, damage-resistances?, death-successes?, death-failures?, exhaustion?, days-without-food?, long-jump?, high-jump?, push-drag?, hold-breath?]
  Proficiencies: [save-proficiencies, skill-proficiencies, expertise?, armor-proficiencies?, weapon-proficiencies, tool-proficiencies?, languages]
  Features: [features, fighting-styles?]
  Attacks: [attack, damage-roll]
  Equipment: [money?, attuned?, inventory?]
  Spells: [caster-level?, spell-save-dc?, spell-attack?, slots-1?, slots-2?, slots-3?, slots-4?, slots-5?, slots-6?, slots-7?, slots-8?, slots-9?, spell-slots?, mystic-arcanum-6?, mystic-arcanum-7?, mystic-arcanum-8?, mystic-arcanum-9?, signature-spell-1?, signature-spell-2?, max-prepared?, spells?, prepared?]
# The dice each number of the sheet is rolled with, for the dashboard's free roll (D-280): an ability check, a saving throw and an attack roll each roll a d20
# and add the number (pp. 77, 83, 94).
sheet-dice:
  1d20: [str-mod, dex-mod, con-mod, int-mod, wis-mod, cha-mod, str-save, dex-save, con-save, int-save, wis-save, cha-save, acrobatics, animal-handling, arcana, athletics, deception, history, insight, intimidation, investigation, medicine, nature, perception, performance, persuasion, religion, sleight-of-hand, stealth, survival, initiative, attack, spell-attack]
# The free roll of a number with advantage or disadvantage, which cancel out (pp. 77, 358–359, D-445): what the sheet and the effects know for sure;
# what depends on the moment, as Frightened in sight of its source or an attack on someone prone, the master says. Exhaustion 1 worsens ability checks, 3
# attacks and saving throws; Poisoned attacks and checks; Blinded, Prone and Restrained attacks, and Restrained Dexterity saves; Invisible betters attacks;
# an armor whose Stealth column says so worsens Stealth (p. 63); heavily encumbered under the rigor simulation worsens what Str, Dex and Con roll (p. 80).
sheet-odds:
  better: 2d20kh1
  worse: 2d20kl1
  when:
    - {fields: [str-mod, dex-mod, con-mod, int-mod, wis-mod, cha-mod, acrobatics, animal-handling, arcana, athletics, deception, history, insight, intimidation, investigation, medicine, nature, perception, performance, persuasion, religion, sleight-of-hand, stealth, survival, initiative], worse: "min(1, best(exhaustion, 0)) + has(effects, Poisoned)"}
    - {fields: [str-save, dex-save, con-save, int-save, wis-save, cha-save], worse: "min(1, max(0, best(exhaustion, 0) - 2))"}
    - {fields: [attack, spell-attack], worse: "min(1, max(0, best(exhaustion, 0) - 2)) + has(effects, Poisoned) + has(effects, Blinded) + has(effects, Prone) + has(effects, Restrained)", better: "has(effects, Invisible)"}
    - {fields: [dex-save], worse: "has(effects, Restrained)"}
    - {fields: [stealth], worse: "count(equipped, stealth-disadvantage = true)"}
    - {fields: [str-mod, dex-mod, con-mod, athletics, acrobatics, sleight-of-hand, stealth, initiative, str-save, dex-save, con-save, attack], worse: "has(rigor, simulation) * min(1, max(0, ceil(best(load, 0) - 10 * best(str, 0))))"}
# The names the game gives a roll, by language, which the dashboard writes on a check's button (D-399): a d20 rolled twice, the higher or the lower kept
# (Advantage and Disadvantage, pp. 76–77).
roll-names:
  2d20kh1: {en: with advantage, it: con vantaggio}
  2d20kl1: {en: with disadvantage, it: con svantaggio}
# What write says of a group once, when a character joins the party (D-206).
sheet-notes:
  Appearance: "a player character's age, height, weight, eyes, skin and hair are the player's, in their words, the age in years: propose them from the race's Age and Size traits when they leave it to you, and keep the look they describe in the page's text too."
  Personality: "a player character's personality traits, ideal, bond and flaw are the player's, in their words, with links to what they name: offer their background's tables, rolled or chosen, or propose some; never write one they did not choose. A companion's are yours to write in the companion's voice, from what the story has shown; ask the player only for a companion they made."
  Proficiencies: "what the race gives (languages, skills, weapons, tools) comes with it: add what the class and background give with add, and never write a whole list over it. Armor and weapons by the names the class page uses, in English, such as weapon-proficiencies: [simple weapons, martial weapons]: the attacks read them."
  Spells: "spells lists the spells the character knows, cantrips included, or keeps in a spellbook; prepared, those prepared today, for a cleric, druid, paladin or wizard: both as links, by the system's names, such as [[Cure Wounds]], [[Shield (spell)]]; a spell the system lacks gets its page first. Slots, save DC and attack are worked out: never write them."
  Combat: "hp-base is the hit points the class's hit dice gave at each level, without Constitution: the system adds con-mod, and hp-per-level when the race or class gives it, for every level. equipped lists the armor and shield worn and the weapons ready, among what the character carries: the system's kind, such as [[Chain Mail]], or an item of the campaign derived from it, as a magic one: the armor class and the attacks follow it. An effect on the armor class gives what it adds, bonus-ac, as Shield of Faith's 2, or the base without armor, unarmored-base, as Mage Armor's 13, to which the system adds Dex."
  Attacks: "Dueling's +2 is on every one-handed melee weapon, as on a sheet: leave it out of a roll with another weapon in hand, or with both hands on a versatile weapon, which rolls its larger die. A monk weapon uses Dex, and rolls the Martial Arts die instead of its own when that is higher, only while the monk wears no armor and holds no shield. A campaign weapon whose dice differ from its kind's copies the kind's damage-roll with its own dice in place, such as 1d10 + str-mod + bonus + 2 * has(fighting-styles, Dueling) slashing. A companion's natural attacks, such as a wolf's bite, are in its stat block, beside the unarmed strike every sheet shows. A magic weapon or armor of the campaign derives from the system's kind and names its magic item: item=[[Longsword]], magic=[[Weapon, +1, +2, or +3]], bonus=1; ammunition's bonus is added to the roll by hand."
  Features: "a choice a feature asks for goes in the list of its kind, by the name the class page gives it, in English, such as fighting-styles: [Archery]; its bonuses follow."
# Where the dashboard puts the groups (D-295): in the rail, as on a paper sheet, the abilities, the saving throws and the skills; then the rest by how often
# play needs them; in a fight, at hand, the armor class, initiative, speed and hit points, the attacks and the spells (D-315).
sheet-cards:
  rail: [Abilities, Saving Throws, Skills]
  order: [Combat, Attacks, Spells, Features, Equipment, Proficiencies, Character, Personality, Appearance]
  at-hand: [ac, initiative, walking, hp, temp-hp, Attacks, Spells]
# The line under a character's name on the dashboard (D-288).
sheet-headline: "Level {level} {classes}"
