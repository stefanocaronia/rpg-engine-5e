# The fifth edition, from the System Reference Document 5.1: see LICENSE.md.
title: the fifth edition from the SRD 5.1, the 2014 rules
language: en
attribution: >-
  This work includes material taken from the System Reference Document 5.1 ("SRD 5.1") by Wizards of the Coast LLC and available at
  https://dnd.wizards.com/resources/systems-reference-document. The SRD 5.1 is licensed under the Creative Commons Attribution 4.0 International License
  available at https://creativecommons.org/licenses/by/4.0/legalcode.
# The coins, as config takes them (Standard Exchange Rates, p. 62): the first counts the totals, a rare one is never given as change.
coins: gp 100, pp 1000 rare, ep 50 rare, sp 10, cp 1
# How long a round lasts (p. 84): in a scene with turns, a duration of up to a minute becomes rounds.
round: 6 seconds
# The character sheet, in groups (D-207, DAT-2): show gives a character so, and Page#Group one group with how each number is made. A field in parentheses
# is shown beside the one before it. Only what the system does not work out (computed, below) is written: status lists it until there is a player character,
# and reminds what a character still lacks; with ? a field written only when it applies, never reminded.
sheet:
  Character: [creature?, size?, classes, subclasses?, background?, feats?, alignment?, level, xp, inspiration?]
  Personality: [personality-traits?, ideal?, bond?, flaw?]
  Abilities: [str (str-mod), dex (dex-mod), con (con-mod), int (int-mod), wis (wis-mod), cha (cha-mod), proficiency]
  Saving Throws: [str-save, dex-save, con-save, int-save, wis-save, cha-save, save-notes?]
  Skills: [acrobatics, animal-handling, arcana, athletics, deception, history, insight, intimidation, investigation, medicine, nature, perception, performance, persuasion, religion, sleight-of-hand, stealth, survival]
  Combat: [ac, initiative, speed, hp-base, hp, temp-hp?, hit-dice-d6?, hit-dice-d8?, hit-dice-d10?, hit-dice-d12?, passive-perception, passive-insight, passive-investigation, darkvision?, damage-resistances?, death-successes?, death-failures?, exhaustion?]
  Proficiencies: [save-proficiencies, skill-proficiencies, expertise?, armor-proficiencies?, weapon-proficiencies?, tool-proficiencies?, languages]
# What write says of a group once, when a character joins the party (D-206).
sheet-notes:
  Personality: "a player character's personality traits, ideal, bond and flaw are the player's, in their words, with links to what they name: propose some if they ask, never write one they did not choose. A companion's are yours to write in the companion's voice, from what the story has shown; ask the player only for a companion they made."
  Proficiencies: "what the race gives (languages, skills, weapons, tools) comes with it: add what the class and background give with add, and never write a whole list over it."
  Combat: "hp-base is the hit points the class's hit dice gave at each level, without Constitution: the system adds con-mod, and hp-per-level when the race or class gives it, for every level."
# The names a list takes (pp. 77, 83): write refuses others, giving these, and validate reports those written by hand. Only lists the game closes:
# expertise is open, since a feature may give it in any tool (D-216).
values:
  save-proficiencies: [str, dex, con, int, wis, cha]
  skill-proficiencies: [Acrobatics, Animal Handling, Arcana, Athletics, Deception, History, Insight, Intimidation, Investigation, Medicine, Nature, Perception, Performance, Persuasion, Religion, Sleight of Hand, Stealth, Survival]
# The lists that mark the numbers of the sheet that read them (D-217): a proficiency, and expertise beside it, as on the paper sheet.
marks: [save-proficiencies, skill-proficiencies, expertise]
# What the line of the player character and the companions shows, in status and in scenes, in order; with ? a field usually at zero: shown, and reported by a recipe, only when it is not.
status-line: [level, hp, temp-hp?, ac, passive-perception, hit-dice-d6, hit-dice-d8, hit-dice-d10, hit-dice-d12, slots-1, slots-2, slots-3, slots-4, slots-5, slots-6, slots-7, slots-8, slots-9, inspiration?, exhaustion?, death-successes?, death-failures?]
# A counter of the player character or a companion at a value, or at every change: the rule to read (pp. 97–98, 358).
thresholds:
  hp 0: Dropping to 0 Hit Points
  death-failures 3: Death Saving Throws
  death-successes 3: Stabilizing a Creature
  exhaustion: Exhaustion
# The rests (pp. 87, 99, 100): the fields they bring to their maximum or to a value, the effects they end, and the titles of the rules for what they leave to the master.
recipes:
  long rest:
    set: { hp: max, temp-hp: 0, slots-*: max }
    ends: [long rest, short rest]
    rules: [Long Rest]
  short rest:
    ends: [short rest]
    rules: [Short Rest]
# The conditions (Appendix PH-A, pp. 358–359): an effect with one of these names shows its rule.
conditions: [Blinded, Charmed, Deafened, Frightened, Grappled, Incapacitated, Invisible, Paralyzed, Petrified, Poisoned, Prone, Restrained, Stunned, Unconscious]
# How the engine reads each field: only counters are counted; numbers, text and lists never are, nor are they money.
fields:
  size: text
  category: text
  alignment: text
  ac: number
  # The Armor Class of armor and shields, as the armor table writes it: "11 + Dex modifier", "+2".
  armor-class: text
  armor: text
  hp: counter
  hp-dice: text
  speed: text
  fly: text
  swim: text
  climb: text
  burrow: text
  str: number
  dex: number
  con: number
  int: number
  wis: number
  cha: number
  saves: list
  skills: list
  damage-vulnerabilities: list
  damage-resistances: list
  damage-immunities: list
  condition-immunities: list
  darkvision: text
  blindsight: text
  tremorsense: text
  truesight: text
  passive-perception: number
  passive-insight: number
  passive-investigation: number
  languages: list
  cr: text
  slots-1: counter
  slots-2: counter
  slots-3: counter
  slots-4: counter
  slots-5: counter
  slots-6: counter
  slots-7: counter
  slots-8: counter
  slots-9: counter
  # The character sheet (pp. 56, 97–99, 358): xp has no maximum, the death saves and exhaustion count up to 3 and 6.
  level: number
  xp: counter
  # A character's classes with their levels, such as [[Fighter]] 3, and subclasses (pp. 8-55); hit dice by the die of each class (p. 56).
  classes: list
  subclasses: list
  # A character's background and feats (pp. 60, 75), as links to their pages, of the system or the campaign's.
  background: text
  feats: list
  hit-die: text
  hit-dice-d6: counter
  hit-dice-d8: counter
  hit-dice-d10: counter
  hit-dice-d12: counter
  temp-hp: counter
  exhaustion: counter
  death-successes: counter
  death-failures: counter
  spell-save-dc: number
  spell-attack: number
  cost: text
  damage: text
  weight: text
  properties: list
  length: text
  uses: counter
  rarity: text
  magic: text
  bonus: number
  # Inspiration, which a character has or has not (p. 60), and the personality (p. 60), as the player says it.
  inspiration: counter
  personality-traits: text
  ideal: text
  bond: text
  flaw: text
  # The sheet as choices (pp. 12, 15, 77–78): the hit points the dice gave without Constitution, and what the character is proficient in, by the SRD's names.
  hp-base: number
  # Hit points at every level from a race or a class, such as a hill dwarf's Dwarven Toughness (p. 4) or Draconic Resilience (p. 45).
  hp-per-level: bonus
  save-proficiencies: list
  # What a race or a class gives beside the numbers (pp. 3–7): advantages on saving throws, as the race says them, and the proficiencies it grants.
  save-notes: list
  armor-proficiencies: list
  weapon-proficiencies: list
  tool-proficiencies: list
  skill-proficiencies: list
  expertise: list
  # Worked out, shown with their sign (D-199).
  str-mod: modifier
  dex-mod: modifier
  con-mod: modifier
  int-mod: modifier
  wis-mod: modifier
  cha-mod: modifier
  proficiency: modifier
  str-save: modifier
  dex-save: modifier
  con-save: modifier
  int-save: modifier
  wis-save: modifier
  cha-save: modifier
  acrobatics: modifier
  animal-handling: modifier
  arcana: modifier
  athletics: modifier
  deception: modifier
  history: modifier
  insight: modifier
  intimidation: modifier
  investigation: modifier
  medicine: modifier
  nature: modifier
  perception: modifier
  performance: modifier
  persuasion: modifier
  religion: modifier
  sleight-of-hand: modifier
  stealth: modifier
  survival: modifier
  initiative: modifier
  # What effects add, such as a ring and a cloak of protection together (pp. 104, 214, 237): different effects add up (D-200).
  bonus-saves: bonus
  bonus-skills: bonus
  bonus-initiative: bonus
# The proficiency bonus by level (p. 56).
tables:
  proficiency-by-level: {1: 2, 5: 3, 9: 4, 13: 5, 17: 6}
# What the system works out from the sheet (D-199): ability modifiers (p. 76), the proficiency bonus (p. 56), saving throws (p. 83), skills with proficiency
# and expertise, which doubles a proficiency the character has (pp. 77–78, 13, 39), initiative, a Dexterity check (p. 90), and the passive Perception, Insight
# and Investigation (p. 78, D-218). A field with two formulas takes the first that has a value (D-210): a character's, which needs a level, then a creature's, from the totals its stat
# block lists in saves and skills, such as Perception +3 (p. 254).
computed:
  str-mod: floor((str - 10) / 2)
  dex-mod: floor((dex - 10) / 2)
  con-mod: floor((con - 10) / 2)
  int-mod: floor((int - 10) / 2)
  wis-mod: floor((wis - 10) / 2)
  cha-mod: floor((cha - 10) / 2)
  level: sum(classes)
  proficiency: table(proficiency-by-level, level)
  str-save:
    - str-mod + proficiency * has(save-proficiencies, str) + bonus-saves
    - str-mod + has(saves, Str) * (item(saves, Str) - str-mod) + bonus-saves
  dex-save:
    - dex-mod + proficiency * has(save-proficiencies, dex) + bonus-saves
    - dex-mod + has(saves, Dex) * (item(saves, Dex) - dex-mod) + bonus-saves
  con-save:
    - con-mod + proficiency * has(save-proficiencies, con) + bonus-saves
    - con-mod + has(saves, Con) * (item(saves, Con) - con-mod) + bonus-saves
  int-save:
    - int-mod + proficiency * has(save-proficiencies, int) + bonus-saves
    - int-mod + has(saves, Int) * (item(saves, Int) - int-mod) + bonus-saves
  wis-save:
    - wis-mod + proficiency * has(save-proficiencies, wis) + bonus-saves
    - wis-mod + has(saves, Wis) * (item(saves, Wis) - wis-mod) + bonus-saves
  cha-save:
    - cha-mod + proficiency * has(save-proficiencies, cha) + bonus-saves
    - cha-mod + has(saves, Cha) * (item(saves, Cha) - cha-mod) + bonus-saves
  acrobatics:
    - dex-mod + proficiency * has(skill-proficiencies, Acrobatics) * (1 + has(expertise, Acrobatics)) + bonus-skills
    - dex-mod + has(skills, Acrobatics) * (item(skills, Acrobatics) - dex-mod) + bonus-skills
  animal-handling:
    - wis-mod + proficiency * has(skill-proficiencies, Animal Handling) * (1 + has(expertise, Animal Handling)) + bonus-skills
    - wis-mod + has(skills, Animal Handling) * (item(skills, Animal Handling) - wis-mod) + bonus-skills
  arcana:
    - int-mod + proficiency * has(skill-proficiencies, Arcana) * (1 + has(expertise, Arcana)) + bonus-skills
    - int-mod + has(skills, Arcana) * (item(skills, Arcana) - int-mod) + bonus-skills
  athletics:
    - str-mod + proficiency * has(skill-proficiencies, Athletics) * (1 + has(expertise, Athletics)) + bonus-skills
    - str-mod + has(skills, Athletics) * (item(skills, Athletics) - str-mod) + bonus-skills
  deception:
    - cha-mod + proficiency * has(skill-proficiencies, Deception) * (1 + has(expertise, Deception)) + bonus-skills
    - cha-mod + has(skills, Deception) * (item(skills, Deception) - cha-mod) + bonus-skills
  history:
    - int-mod + proficiency * has(skill-proficiencies, History) * (1 + has(expertise, History)) + bonus-skills
    - int-mod + has(skills, History) * (item(skills, History) - int-mod) + bonus-skills
  insight:
    - wis-mod + proficiency * has(skill-proficiencies, Insight) * (1 + has(expertise, Insight)) + bonus-skills
    - wis-mod + has(skills, Insight) * (item(skills, Insight) - wis-mod) + bonus-skills
  intimidation:
    - cha-mod + proficiency * has(skill-proficiencies, Intimidation) * (1 + has(expertise, Intimidation)) + bonus-skills
    - cha-mod + has(skills, Intimidation) * (item(skills, Intimidation) - cha-mod) + bonus-skills
  investigation:
    - int-mod + proficiency * has(skill-proficiencies, Investigation) * (1 + has(expertise, Investigation)) + bonus-skills
    - int-mod + has(skills, Investigation) * (item(skills, Investigation) - int-mod) + bonus-skills
  medicine:
    - wis-mod + proficiency * has(skill-proficiencies, Medicine) * (1 + has(expertise, Medicine)) + bonus-skills
    - wis-mod + has(skills, Medicine) * (item(skills, Medicine) - wis-mod) + bonus-skills
  nature:
    - int-mod + proficiency * has(skill-proficiencies, Nature) * (1 + has(expertise, Nature)) + bonus-skills
    - int-mod + has(skills, Nature) * (item(skills, Nature) - int-mod) + bonus-skills
  perception:
    - wis-mod + proficiency * has(skill-proficiencies, Perception) * (1 + has(expertise, Perception)) + bonus-skills
    - wis-mod + has(skills, Perception) * (item(skills, Perception) - wis-mod) + bonus-skills
  performance:
    - cha-mod + proficiency * has(skill-proficiencies, Performance) * (1 + has(expertise, Performance)) + bonus-skills
    - cha-mod + has(skills, Performance) * (item(skills, Performance) - cha-mod) + bonus-skills
  persuasion:
    - cha-mod + proficiency * has(skill-proficiencies, Persuasion) * (1 + has(expertise, Persuasion)) + bonus-skills
    - cha-mod + has(skills, Persuasion) * (item(skills, Persuasion) - cha-mod) + bonus-skills
  religion:
    - int-mod + proficiency * has(skill-proficiencies, Religion) * (1 + has(expertise, Religion)) + bonus-skills
    - int-mod + has(skills, Religion) * (item(skills, Religion) - int-mod) + bonus-skills
  sleight-of-hand:
    - dex-mod + proficiency * has(skill-proficiencies, Sleight of Hand) * (1 + has(expertise, Sleight of Hand)) + bonus-skills
    - dex-mod + has(skills, Sleight of Hand) * (item(skills, Sleight of Hand) - dex-mod) + bonus-skills
  stealth:
    - dex-mod + proficiency * has(skill-proficiencies, Stealth) * (1 + has(expertise, Stealth)) + bonus-skills
    - dex-mod + has(skills, Stealth) * (item(skills, Stealth) - dex-mod) + bonus-skills
  survival:
    - wis-mod + proficiency * has(skill-proficiencies, Survival) * (1 + has(expertise, Survival)) + bonus-skills
    - wis-mod + has(skills, Survival) * (item(skills, Survival) - wis-mod) + bonus-skills
  initiative: dex-mod + bonus-initiative
  passive-perception: 10 + perception
  passive-insight: 10 + insight
  passive-investigation: 10 + investigation
# The hit point maximum (pp. 12, 56): what the dice gave, and at every level the Constitution modifier, which follows it when it changes, and the hit
# points a race adds; at every sorcerer level the Draconic Bloodline's hit point (p. 45). A hit die for each level in a class, of that class's die, counted
# only for a character with classes, from the die its page writes, of the system or the campaign (p. 56, D-215); inspiration, which a character has or has not (p. 60).
counters:
  hp: {max: "hp-base + level * (con-mod + hp-per-level) + has(subclasses, Draconic Bloodline) * item(classes, Sorcerer)"}
  hit-dice-d6: {max: "sum(classes, hit-die = d6)"}
  hit-dice-d8: {max: "sum(classes, hit-die = d8)"}
  hit-dice-d10: {max: "sum(classes, hit-die = d10)"}
  hit-dice-d12: {max: "sum(classes, hit-die = d12)"}
  inspiration: {max: 1}
