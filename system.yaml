# The fifth edition, from the System Reference Document 5.1: see LICENSE.md.
title: the fifth edition from the SRD 5.1, the 2014 rules
language: en
attribution: >-
  This work includes material taken from the System Reference Document 5.1 ("SRD 5.1") by Wizards of the Coast LLC and available at
  https://dnd.wizards.com/resources/systems-reference-document. The SRD 5.1 is licensed under the Creative Commons Attribution 4.0 International License
  available at https://creativecommons.org/licenses/by/4.0/legalcode.
# The coins, as config takes them (Standard Exchange Rates, p. 62): the first counts the totals, a rare one is never given as change.
coins: gp 100, pp 1000 rare, ep 50 rare, sp 10, cp 1
# How long a round lasts (p. 84): in a scene with turns, a duration of up to a minute becomes rounds.
round: 6 seconds
# The character sheet, in groups (D-207, DAT-2): show gives a character so, and Page#Group one group with how each number is made. A field in parentheses
# is shown beside the one before it. Only what the system does not work out (computed, below) is written: status lists it until there is a player character,
# and reminds what a character still lacks; with ? a field written only when it applies, never reminded.
sheet:
  Character: [level, xp, inspiration?]
  Personality: [traits?, ideals?, bonds?, flaws?]
  Abilities: [str (str-mod), dex (dex-mod), con (con-mod), int (int-mod), wis (wis-mod), cha (cha-mod), proficiency]
  Saving Throws: [str-save, dex-save, con-save, int-save, wis-save, cha-save]
  Skills: [acrobatics, animal-handling, arcana, athletics, deception, history, insight, intimidation, investigation, medicine, nature, perception, performance, persuasion, religion, sleight-of-hand, stealth, survival]
  Combat: [ac, initiative, speed, hp-base, hp, temp-hp?, hit-dice, passive-perception, death-successes?, death-failures?, exhaustion?]
  Proficiencies: [save-proficiencies, skill-proficiencies, expertise?, languages]
# What write says of a group once, when a character joins the party (D-206).
sheet-notes:
  Personality: "traits, ideals, bonds and flaws are the player's, in their words, with links to what they name: propose some if they ask, never write one they did not choose."
# The names a list takes (pp. 77, 83, 13, 39): write refuses others, giving these, and validate reports those written by hand.
values:
  save-proficiencies: [str, dex, con, int, wis, cha]
  skill-proficiencies: [Acrobatics, Animal Handling, Arcana, Athletics, Deception, History, Insight, Intimidation, Investigation, Medicine, Nature, Perception, Performance, Persuasion, Religion, Sleight of Hand, Stealth, Survival]
  expertise: [Acrobatics, Animal Handling, Arcana, Athletics, Deception, History, Insight, Intimidation, Investigation, Medicine, Nature, Perception, Performance, Persuasion, Religion, Sleight of Hand, Stealth, Survival, Thieves' Tools]
# What the line of the player character and the companions shows, in status and in scenes, in order; with ? a field usually at zero: shown, and reported by a recipe, only when it is not.
status-line: [level, hp, temp-hp?, ac, passive-perception, hit-dice, slots-1, slots-2, slots-3, slots-4, slots-5, slots-6, slots-7, slots-8, slots-9, inspiration?, exhaustion?, death-successes?, death-failures?]
# A counter of the player character or a companion at a value, or at every change: the rule to read (pp. 97–98, 358).
thresholds:
  hp 0: Dropping to 0 Hit Points
  death-failures 3: Death Saving Throws
  death-successes 3: Stabilizing a Creature
  exhaustion: Exhaustion
# The rests (pp. 87, 99, 100): the fields they bring to their maximum or to a value, the effects they end, and the titles of the rules for what they leave to the master.
recipes:
  long rest:
    set: { hp: max, temp-hp: 0, slots-*: max }
    ends: [long rest, short rest]
    rules: [Long Rest]
  short rest:
    ends: [short rest]
    rules: [Short Rest]
# The conditions (Appendix PH-A, pp. 358–359): an effect with one of these names shows its rule.
conditions: [Blinded, Charmed, Deafened, Frightened, Grappled, Incapacitated, Invisible, Paralyzed, Petrified, Poisoned, Prone, Restrained, Stunned, Unconscious]
# How the engine reads each field: only counters are counted; numbers, text and lists never are, nor are they money.
fields:
  size: text
  category: text
  alignment: text
  ac: number
  # The Armor Class of armor and shields, as the armor table writes it: "11 + Dex modifier", "+2".
  armor-class: text
  armor: text
  hp: counter
  hp-dice: text
  speed: text
  fly: text
  swim: text
  climb: text
  burrow: text
  str: number
  dex: number
  con: number
  int: number
  wis: number
  cha: number
  saves: list
  skills: list
  damage-vulnerabilities: list
  damage-resistances: list
  damage-immunities: list
  condition-immunities: list
  darkvision: text
  blindsight: text
  tremorsense: text
  truesight: text
  passive-perception: number
  languages: list
  cr: text
  slots-1: counter
  slots-2: counter
  slots-3: counter
  slots-4: counter
  slots-5: counter
  slots-6: counter
  slots-7: counter
  slots-8: counter
  slots-9: counter
  # The character sheet (pp. 56, 97–99, 358): xp has no maximum, the death saves and exhaustion count up to 3 and 6.
  level: number
  xp: counter
  hit-dice: counter
  temp-hp: counter
  exhaustion: counter
  death-successes: counter
  death-failures: counter
  spell-save-dc: number
  spell-attack: number
  cost: text
  damage: text
  weight: text
  properties: list
  length: text
  uses: counter
  rarity: text
  magic: text
  bonus: number
  # Inspiration, which a character has or has not (p. 60), and the personality (p. 60), as the player says it.
  inspiration: number
  traits: text
  ideals: text
  bonds: text
  flaws: text
  # The sheet as choices (pp. 12, 15, 77–78): the hit points the dice gave without Constitution, and what the character is proficient in, by the SRD's names.
  hp-base: number
  save-proficiencies: list
  skill-proficiencies: list
  expertise: list
  # Worked out, shown with their sign (D-199).
  str-mod: modifier
  dex-mod: modifier
  con-mod: modifier
  int-mod: modifier
  wis-mod: modifier
  cha-mod: modifier
  proficiency: modifier
  str-save: modifier
  dex-save: modifier
  con-save: modifier
  int-save: modifier
  wis-save: modifier
  cha-save: modifier
  acrobatics: modifier
  animal-handling: modifier
  arcana: modifier
  athletics: modifier
  deception: modifier
  history: modifier
  insight: modifier
  intimidation: modifier
  investigation: modifier
  medicine: modifier
  nature: modifier
  perception: modifier
  performance: modifier
  persuasion: modifier
  religion: modifier
  sleight-of-hand: modifier
  stealth: modifier
  survival: modifier
  initiative: modifier
  # What effects add, such as a ring and a cloak of protection together (pp. 104, 214, 237): different effects add up (D-200).
  bonus-saves: bonus
  bonus-skills: bonus
  bonus-initiative: bonus
# The proficiency bonus by level (p. 56).
tables:
  proficiency-by-level: {1: 2, 5: 3, 9: 4, 13: 5, 17: 6}
# What the system works out from the sheet (D-199): ability modifiers (p. 76), the proficiency bonus (p. 56), saving throws (p. 83), skills with proficiency
# and expertise (pp. 77–78, 13, 39), initiative, a Dexterity check (p. 90), and the passive Wisdom (Perception) (p. 78).
computed:
  str-mod: floor((str - 10) / 2)
  dex-mod: floor((dex - 10) / 2)
  con-mod: floor((con - 10) / 2)
  int-mod: floor((int - 10) / 2)
  wis-mod: floor((wis - 10) / 2)
  cha-mod: floor((cha - 10) / 2)
  proficiency: table(proficiency-by-level, level)
  str-save: str-mod + proficiency * has(save-proficiencies, str) + bonus-saves
  dex-save: dex-mod + proficiency * has(save-proficiencies, dex) + bonus-saves
  con-save: con-mod + proficiency * has(save-proficiencies, con) + bonus-saves
  int-save: int-mod + proficiency * has(save-proficiencies, int) + bonus-saves
  wis-save: wis-mod + proficiency * has(save-proficiencies, wis) + bonus-saves
  cha-save: cha-mod + proficiency * has(save-proficiencies, cha) + bonus-saves
  acrobatics: dex-mod + proficiency * (has(skill-proficiencies, Acrobatics) + has(expertise, Acrobatics)) + bonus-skills
  animal-handling: wis-mod + proficiency * (has(skill-proficiencies, Animal Handling) + has(expertise, Animal Handling)) + bonus-skills
  arcana: int-mod + proficiency * (has(skill-proficiencies, Arcana) + has(expertise, Arcana)) + bonus-skills
  athletics: str-mod + proficiency * (has(skill-proficiencies, Athletics) + has(expertise, Athletics)) + bonus-skills
  deception: cha-mod + proficiency * (has(skill-proficiencies, Deception) + has(expertise, Deception)) + bonus-skills
  history: int-mod + proficiency * (has(skill-proficiencies, History) + has(expertise, History)) + bonus-skills
  insight: wis-mod + proficiency * (has(skill-proficiencies, Insight) + has(expertise, Insight)) + bonus-skills
  intimidation: cha-mod + proficiency * (has(skill-proficiencies, Intimidation) + has(expertise, Intimidation)) + bonus-skills
  investigation: int-mod + proficiency * (has(skill-proficiencies, Investigation) + has(expertise, Investigation)) + bonus-skills
  medicine: wis-mod + proficiency * (has(skill-proficiencies, Medicine) + has(expertise, Medicine)) + bonus-skills
  nature: int-mod + proficiency * (has(skill-proficiencies, Nature) + has(expertise, Nature)) + bonus-skills
  perception: wis-mod + proficiency * (has(skill-proficiencies, Perception) + has(expertise, Perception)) + bonus-skills
  performance: cha-mod + proficiency * (has(skill-proficiencies, Performance) + has(expertise, Performance)) + bonus-skills
  persuasion: cha-mod + proficiency * (has(skill-proficiencies, Persuasion) + has(expertise, Persuasion)) + bonus-skills
  religion: int-mod + proficiency * (has(skill-proficiencies, Religion) + has(expertise, Religion)) + bonus-skills
  sleight-of-hand: dex-mod + proficiency * (has(skill-proficiencies, Sleight of Hand) + has(expertise, Sleight of Hand)) + bonus-skills
  stealth: dex-mod + proficiency * (has(skill-proficiencies, Stealth) + has(expertise, Stealth)) + bonus-skills
  survival: wis-mod + proficiency * (has(skill-proficiencies, Survival) + has(expertise, Survival)) + bonus-skills
  initiative: dex-mod + bonus-initiative
  passive-perception: 10 + perception
# The hit point maximum (pp. 12, 56): what the dice gave, and the Constitution modifier at every level, which follows the modifier when it changes.
counters:
  hp: {max: hp-base + level * con-mod}
