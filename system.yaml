    - int-mod + proficiency * has(skill-proficiencies, Investigation) * (1 + has(expertise, Investigation)) + (1 - has(skill-proficiencies, Investigation)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - int-mod + bonus-skills
  medicine:
