    - wis-mod + proficiency * has(skill-proficiencies, Medicine) * (1 + has(expertise, Medicine)) + (1 - has(skill-proficiencies, Medicine)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - wis-mod + bonus-skills
  nature:
    - item(skills, Nature) / has(skills, Nature) + bonus-skills
    - int-mod + proficiency * has(skill-proficiencies, Nature) * (1 + has(expertise, Nature)) + (1 - has(skill-proficiencies, Nature)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - int-mod + bonus-skills
  perception:
    - item(skills, Perception) / has(skills, Perception) + bonus-skills
    - wis-mod + proficiency * has(skill-proficiencies, Perception) * (1 + has(expertise, Perception)) + (1 - has(skill-proficiencies, Perception)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - wis-mod + bonus-skills
  performance:
    - item(skills, Performance) / has(skills, Performance) + bonus-skills
    - cha-mod + proficiency * has(skill-proficiencies, Performance) * (1 + has(expertise, Performance)) + (1 - has(skill-proficiencies, Performance)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - cha-mod + bonus-skills
  persuasion:
    - item(skills, Persuasion) / has(skills, Persuasion) + bonus-skills
    - cha-mod + proficiency * has(skill-proficiencies, Persuasion) * (1 + has(expertise, Persuasion)) + (1 - has(skill-proficiencies, Persuasion)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - cha-mod + bonus-skills
  religion:
