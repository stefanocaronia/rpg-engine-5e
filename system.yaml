# The names a list takes (pp. 77, 83): write refuses others, giving these, and validate reports those written by hand. Only lists the game closes:
# expertise is open, since a feature may give it in any tool (D-216).
values:
  # The alignments (pp. 58–59): the nine of a character, and those the SRD's creatures have.
  alignment: [lawful good, neutral good, chaotic good, lawful neutral, neutral, chaotic neutral, lawful evil, neutral evil, chaotic evil, unaligned, any alignment, any chaotic alignment, any evil alignment, any non-good alignment, any non-lawful alignment, "neutral good (50%) or neutral evil (50%)"]
  # The sizes (p. 92, Size Categories): the space on the map and the load come from them (D-435).
  size: [Tiny, Small, Medium, Large, Huge, Gargantuan]
  save-proficiencies: [str, dex, con, int, wis, cha]
  skill-proficiencies: [Acrobatics, Animal Handling, Arcana, Athletics, Deception, History, Insight, Intimidation, Investigation, Medicine, Nature, Perception, Performance, Persuasion, Religion, Sleight of Hand, Stealth, Survival]
# The names a list takes on the sheet of the player character and of a companion, where the master writes them (D-435): the languages (p. 59, and the
# Primordial's dialects the creatures speak), the tools (pp. 70–71; vehicles, land or water in parentheses) and the damage types (p. 97). A campaign adds
# its own with config values; a creature's stat block keeps the SRD's words, as "slashing from nonmagical attacks".
sheet-values:
  languages: [Common, Dwarvish, Elvish, Giant, Gnomish, Goblin, Halfling, Orc, Abyssal, Celestial, Draconic, Deep Speech, Infernal, Primordial, Aquan, Auran, Ignan, Terran, Sylvan, Undercommon, Druidic, Thieves' Cant]
  tool-proficiencies: [alchemist's supplies, brewer's supplies, calligrapher's supplies, carpenter's tools, cartographer's tools, cobbler's tools, cook's utensils, glassblower's tools, jeweler's tools, leatherworker's tools, mason's tools, painter's supplies, potter's tools, smith's tools, tinker's tools, weaver's tools, woodcarver's tools, disguise kit, forgery kit, dice set, playing card set, herbalism kit, bagpipes, drum, dulcimer, flute, lute, lyre, horn, pan flute, shawm, viol, navigator's tools, poisoner's kit, thieves' tools, vehicles]
  damage-resistances: [acid, bludgeoning, cold, fire, force, lightning, necrotic, piercing, poison, psychic, radiant, slashing, thunder]
  damage-immunities: [acid, bludgeoning, cold, fire, force, lightning, necrotic, piercing, poison, psychic, radiant, slashing, thunder]
  damage-vulnerabilities: [acid, bludgeoning, cold, fire, force, lightning, necrotic, piercing, poison, psychic, radiant, slashing, thunder]
# The classes give the row of their table at the character's level in each (pp. 8–55, D-201, D-219): its columns as values of the sheet, such as Rage Damage,
# and the features gained up to that level, a subclass adding those it lists at the level of its class. The proficiency bonus is worked out from the
# character's level (p. 56), and the spell slots come with the spells.
progression:
  list: classes
  features: Features
  skip: [Proficiency Bonus, 1st, 2nd, 3rd, 4th, 5th, 6th, 7th, 8th, 9th]
  # A subclass adds to prepared the spells it lists by its class's level, always prepared and not counted: a domain's or an oath's (pp. 16, 32; PRO-7).
  parts: {list: subclasses, field: class, lists: [prepared]}
  # The experience points each level needs (p. 56, D-205, PRO-6): the line says how many the next one needs, and status when one is due.
  experience: {field: xp, table: xp-by-level, rules: Beyond 1st Level}
# The fields whose value on the page of each item of a list is a formula worked out on the character, once for each item (PRO-5, D-227): a class's save DC,
# attack and prepared spells, since each spell uses its class's ability (p. 58).
item-formulas:
  classes: [spell-save-dc, spell-attack, max-prepared, unarmored-ac]
  # What an armor, a shield and a weapon give who has it equipped (pp. 63, 65, D-231): the armor class and its bonus, the attack and the damage.
  equipped: [armor-class, armor-class-bonus, attack, damage-roll, speed-slowed]
# What every character with a sheet has in a list without writing it there (DAT-13, D-235): the unarmed strike, always ready, among the attacks as on a sheet (p. 92).
always-in:
  equipped: [Unarmed Strike]
# The lists that mark the numbers of the sheet that read them (D-217): a proficiency, and expertise beside it, as on the paper sheet.
marks: [save-proficiencies, skill-proficiencies, expertise]
# What the line of the player character and the companions shows, in status and in scenes, in order; with ? a field usually at zero: shown, and reported by a recipe, only when it is not.
status-line: [level, xp, hp, temp-hp?, ac, passive-perception, hit-dice-d6, hit-dice-d8, hit-dice-d10, hit-dice-d12, slots-1, slots-2, slots-3, slots-4, slots-5, slots-6, slots-7, slots-8, slots-9, inspiration?, exhaustion?, death-successes?, death-failures?]
# A counter of the player character or a companion at a value, or at every change: the rule to read (pp. 97–98, 358).
thresholds:
  hp 0: Dropping to 0 Hit Points
  death-failures 3: Death Saving Throws
  death-successes 3: Stabilizing a Creature
  exhaustion: Exhaustion
  # Temporary hit points, named when they come and when they go (p. 98, D-266, D-268); damage takes them first (shields, below).
  temp-hp 0: Temporary Hit Points
# The rests (pp. 87, 99, 100): the fields they bring to their maximum or to a value, the effects they end, and the titles of the rules for what they leave to the master.
# The uses below come back with the rests they name; a long rest brings back up to half the hit dice, at least one, of any kind (pp. 57, 87).
recipes:
  long rest:
    set: { hp: max, temp-hp: 0, slots-*: max }
    regain: { hit-dice-*: "max(1, floor(level / 2))" }
    # And a level of exhaustion less, with food and drink (p. 358).
    lower: { exhaustion: 1 }
    ends: [long rest, short rest]
    rules: [Long Rest]
  short rest:
    ends: [short rest]
    rules: [Short Rest]
# What the creatures overcome in a scene give the party (D-205, DAT-11): scene close says the xp of those at 0 hit points (p. 258), shared among the party there,
# as the game is played (the SRD 5.1 does not write it).
rewards:
  xp: {from: xp-value, overcome: hp 0}
# The conditions (Appendix PH-A, pp. 358–359): an effect with one of these names shows its rule.
conditions: [Blinded, Charmed, Deafened, Frightened, Grappled, Incapacitated, Invisible, Paralyzed, Petrified, Poisoned, Prone, Restrained, Stunned, Unconscious]
# The drawing of each condition on the dashboard's tokens and in Combat (D-419): the d of an SVG path on a grid of 24, drawn as a line; drawn for rpg-engine.
condition-icons:
  Blinded: "M3 12c2.5-4 5.5-6 9-6s6.5 2 9 6c-2.5 4-5.5 6-9 6s-6.5-2-9-6Z M4.5 19.5l15-15"
  Charmed: "M12 19.5s-7.5-4.6-7.5-9.6a4 4 0 0 1 7.5-2a4 4 0 0 1 7.5 2c0 5-7.5 9.6-7.5 9.6Z"
  Deafened: "M4 9.5h3l4.5-4v13l-4.5-4H4Z M15 9.5l5 5 M20 9.5l-5 5"
  Frightened: "M6 19.75V10.25a6 6 0 0 1 12 0v9.5l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5Z M10 9.75v1 M14 9.75v1"
  Grappled: "M3 12h6 M6.5 9l2.5 3-2.5 3 M21 12h-6 M17.5 9 15 12l2.5 3"
  Incapacitated: "M4.5 12a7.5 7.5 0 1 0 15 0a7.5 7.5 0 1 0-15 0Z M6.7 6.7l10.6 10.6"
  Invisible: "M8.71 6.8A3.5 3.5 0 0 1 10.8 4.71 M13.2 4.71A3.5 3.5 0 0 1 15.29 6.8 M15.29 9.2A3.5 3.5 0 0 1 13.2 11.29 M10.8 11.29A3.5 3.5 0 0 1 8.71 9.2 M5 20.5c.3-2 1.2-3.5 2.6-4.5 M10 14.9c1.3-.4 2.7-.4 4 0 M16.4 16c1.4 1 2.3 2.5 2.6 4.5"
  Paralyzed: "M13.5 3 6 13.5h5.5L10.5 21 18 10.5h-5.5Z"
  Petrified: "M5 19.5 3.5 13 7 6.5 13 4.5 19 7.5 20.5 14 17 19.5Z M11.5 4.8 13 9.5 10.5 12.5 12.5 16.5"
  Poisoned: "M12 3.5c3.2 4.6 5.5 7.6 5.5 10.8a5.5 5.5 0 0 1-11 0c0-3.2 2.3-6.2 5.5-10.8Z M10 15.5a2 2 0 0 0 2 2"
  Prone: "M12 4v10.5 M8 10.5l4 4 4-4 M4 20h16"
  Restrained: "M10 14l4-4 M8.5 11.5l-2 2a3 3 0 0 0 4.2 4.2l2-2 M15.5 12.5l2-2a3 3 0 0 0-4.2-4.2l-2 2"
  Stunned: "M12 12.75a1.5 1.5 0 0 1 3 0a3 3 0 0 1-6 0a4.5 4.5 0 0 1 9 0a6 6 0 0 1-12 0a7.5 7.5 0 0 1 7.5-7.5"
  Unconscious: "M4.5 7.5h5l-5 6h5 M13 12h6.5l-6.5 8h6.5"
# What breaks a spell someone concentrates on (p. 102, D-266, EFF-14): damage, being incapacitated (the last four incapacitate, pp. 358–359), dying.
# What a character uses up each day (Adventuring, Food and Water; D-435): under the rigor rules, a ration a day outside a settlement, the days without food it can go,
# 3 + Constitution modifier (at least 1), and then a level of exhaustion each day; water as a word, for the story keeps where to drink.
upkeep: {daily: Rations, short: days-without-food, grace: 3 + con-mod, worsens: exhaustion, water: "a gallon each, two if the weather is hot", rules: Food and Water}
# What burns (Adventuring Gear): an effect named after it spends one, or a flask of oil for a lamp or a lantern, and lasts as long as it burns.
burning:
  Torch: {lasts: 1h}
  Candle: {lasts: 1h}
  Lamp: {lasts: 6h, spends: Oil}
  Hooded Lantern: {lasts: 6h, spends: Oil}
  Bullseye Lantern: {lasts: 6h, spends: Oil}
# What the pages one is attuned to and one's feats give, added up as effects are (D-449): a page, of the system or the campaign, writes its bonus fields
# as numbers, such as bonus-ac: 1 on a Ring of Protection, or bonus-speed: 10 on a feat.
bonus-lists: [attuned, feats]
# Attunement (p. 206): at most three magic items at once, each one whose attunement asks for it; who may attune, as by a paladin, the master checks (D-435).
bonds:
  attuned: {most: 3, needs: attunement, rules: Attunement}
keeping: {counter: hp, conditions: [Incapacitated, Paralyzed, Petrified, Stunned, Unconscious], rules: Concentration}
# What a fight follows on the dashboard's Combat (D-314): hit points, a foe's told in words; who cannot act (p. 358), never a turn skipped.
combat: {track: hp, in-words: true, inactive: [Incapacitated, Paralyzed, Petrified, Stunned, Unconscious]}
# At 0 hit points the death saves, big on the dashboard (p. 98, D-310, D-314).
dying: {at: hp 0, show: [death-successes, death-failures]}
# How the engine reads each field: only counters are counted; numbers, text and lists never are, nor are they money.
fields:
  size: text
  category: text
  alignment: text
  # The look of a character, as the second page of the character sheet has it: the age in years, the rest in the player's words.
  age: number
  height: text
  eyes: text
  skin: text
  hair: text
  ac: number
  # The Armor Class of an armor and a shield as formulas on who wears them (p. 63): "11 + dex-mod + bonus", the bonus a magic one adds; what the Armor table
  # says of Strength and Stealth (p. 63). A weapon's attack and damage, with its ability, its proficiency and its bonus (pp. 65, 146).
  armor-class: text
  armor-class-bonus: bonus
  strength-required: number
  stealth-disadvantage: text
  attack: modifier
  damage-roll: text
  # A character's armor class without armor (pp. 8, 26, 45): what a class gives, as Unarmored Defense; what an effect gives, as Mage Armor's 13
  # (unarmored-base); what effects add, as a Ring of Protection (bonus-ac); the fighting styles chosen (p. 24).
  unarmored-ac: number
  unarmored-base: number
  bonus-ac: bonus
  fighting-styles: list
  armor: text
  hp: counter
  hp-dice: text
  speed: text
  fly: text
  swim: text
  climb: text
  burrow: text
  str: number
  dex: number
  con: number
  int: number
  wis: number
  cha: number
  saves: list
  skills: list
  damage-vulnerabilities: list
  damage-resistances: list
  damage-immunities: list
  condition-immunities: list
  darkvision: text
  blindsight: text
  tremorsense: text
  truesight: text
  passive-perception: number
  passive-insight: number
  passive-investigation: number
  languages: list
  cr: text
  # The experience points a creature is worth, as its stat block gives them beside its challenge (p. 258): what overcoming it gives the party (DAT-11).
  xp-value: number
  slots-1: counter
  slots-2: counter
  slots-3: counter
  slots-4: counter
  slots-5: counter
  slots-6: counter
  slots-7: counter
  slots-8: counter
  slots-9: counter
  # The character sheet (pp. 56, 97–99, 358): xp has no maximum, the death saves and exhaustion count up to 3 and 6.
  level: number
  xp: counter
  # A character's classes with their levels, such as [[Fighter]] 3, and subclasses (pp. 8-55); hit dice by the die of each class (p. 56).
  classes: list
  subclasses: list
  # A character's background and feats (pp. 60, 75), as links to their pages, of the system or the campaign's.
  background: text
  feats: list
  # The days a character has gone without food (Food and Water, UPK-2).
  days-without-food: number
  # The magic items a character is attuned to (p. 206, BND-1).
  attuned: list
  hit-die: text
  # The features of a character, which its classes give; on a subclass, those it gives with the level of its class, and the class it belongs to (D-219).
  features: list
  class: text
  # The columns of the classes' tables (pp. 8–55), at the character's level in each.
  rages: counter
  rage-damage: modifier
  martial-arts: text
  ki-points: counter
  unarmored-movement: text
  # The speeds now in each mode, worked out from the written ones (D-445, SPD-1), and what changes them: effects add to bonus-speed and multiply
  # speed-factor; a heavy armor's page gives speed-slowed; a race that heavy armor does not slow gives armor-unhindered.
  walking: length
  long-jump: length
  high-jump: length
  push-drag: number
  hold-breath: number
  flying: length
  swimming: length
  climbing: length
  burrowing: length
  bonus-speed: bonus
  speed-factor: factor
  speed-slowed: bonus
  armor-unhindered: bonus
  sneak-attack: text
  sorcery-points: counter
  cantrips-known: number
  spells-known: number
  spell-slots: counter
  slot-level: text
  invocations-known: number
  # Uses of features and traits (D-204, D-220), named after them.
  channel-divinity: counter
  action-surge: counter
  second-wind: counter
  indomitable: counter
  wild-shape: counter
  bardic-inspiration: counter
  divine-sense: counter
  lay-on-hands: counter
  cleansing-touch: counter
  arcane-recovery: counter
  natural-recovery: counter
  wholeness-of-body: counter
  holy-nimbus: counter
  dark-ones-own-luck: counter
  hurl-through-hell: counter
  stroke-of-luck: counter
  eldritch-master: counter
  breath-weapon: counter
  relentless-endurance: counter
  hit-dice-d6: counter
  hit-dice-d8: counter
  hit-dice-d10: counter
  hit-dice-d12: counter
  temp-hp: counter
  exhaustion: counter
  death-successes: counter
  death-failures: counter
  spell-save-dc: number
  spell-attack: modifier
  max-prepared: number
  caster-level: number
  mystic-arcanum-6: counter
  mystic-arcanum-7: counter
  mystic-arcanum-8: counter
  mystic-arcanum-9: counter
  signature-spell-1: counter
  signature-spell-2: counter
  spellcasting: text
  spells: list
  prepared: list
  cost: text
  damage: text
  weight: text
  properties: list
  length: text
  # What is sold by the bundle and counted in pieces, as Arrows (20) (p. 69, STK-2): cost and weight are the bundle's.
  bundle: number
  uses: counter
  # A magic item's charges, as a wand's 7 (p. 140): a counter of one thing, which no stack keeps (STK-1).
  charges: counter
  # A magic item's rarity, and the attunement it requires: true, or what it asks, as the SRD writes it, such as by a paladin (p. 206).
  rarity: text
  attunement: text
  magic: text
  bonus: bonus
  # A spell (pp. 114–194): its level, 0 for a cantrip, its school and the lines of its header as the SRD writes them; ritual and concentration only when
  # true; the classes whose spell list names it (pp. 105–113). Never level or classes, which are a character's.
  spell-level: number
  school: text
  ritual: text
  casting-time: text
  range: text
  components: text
  duration: text
  concentration: text
  spell-lists: list
  # Inspiration, which a character has or has not (p. 60), and the personality (p. 60), as the player says it.
  inspiration: counter
  personality-traits: text
  ideal: text
  bond: text
  flaw: text
  # The sheet as choices (pp. 12, 15, 77–78): the hit points the dice gave without Constitution, and what the character is proficient in, by the SRD's names.
  hp-base: number
  # Hit points at every level from a race or a class, such as a hill dwarf's Dwarven Toughness (p. 4) or Draconic Resilience (p. 45).
  hp-per-level: bonus
  save-proficiencies: list
  # What a race or a class gives beside the numbers (pp. 3–7): advantages on saving throws, as the race says them, and the proficiencies it grants.
  save-notes: list
  armor-proficiencies: list
  weapon-proficiencies: list
  tool-proficiencies: list
  skill-proficiencies: list
  expertise: list
  # Worked out, shown with their sign (D-199).
  str-mod: modifier
  dex-mod: modifier
  con-mod: modifier
  int-mod: modifier
  wis-mod: modifier
  cha-mod: modifier
  proficiency: modifier
  str-save: modifier
  dex-save: modifier
  con-save: modifier
  int-save: modifier
  wis-save: modifier
  cha-save: modifier
  acrobatics: modifier
  animal-handling: modifier
  arcana: modifier
  athletics: modifier
  deception: modifier
  history: modifier
  insight: modifier
  intimidation: modifier
  investigation: modifier
  medicine: modifier
  nature: modifier
  perception: modifier
  performance: modifier
  persuasion: modifier
  religion: modifier
  sleight-of-hand: modifier
  stealth: modifier
  survival: modifier
  initiative: modifier
  # What effects add, such as a ring and a cloak of protection together (pp. 104, 214, 237): different effects add up (D-200).
  bonus-saves: bonus
  bonus-skills: bonus
  # What an item adds to the save DC and the attack of every spell, as a Robe of the Archmagi to both and a Wand of the War Mage to the attack (pp. 239, 249).
  bonus-spell-dc: bonus
  bonus-spell-attack: bonus
  bonus-initiative: bonus
# The proficiency bonus by level (p. 56).
tables:
  # What a size does to how much one carries (p. 176, Size and Strength).
  carry-by-size: {Tiny: 0.5, Small: 1, Medium: 1, Large: 2, Huge: 4, Gargantuan: 8}
  proficiency-by-level: {1: 2, 5: 3, 9: 4, 13: 5, 17: 6}
  # The experience points each level needs (Character Advancement, p. 56).
  xp-by-level: {1: 0, 2: 300, 3: 900, 4: 2700, 5: 6500, 6: 14000, 7: 23000, 8: 34000, 9: 48000, 10: 64000, 11: 85000, 12: 100000, 13: 120000, 14: 140000, 15: 165000, 16: 195000, 17: 225000, 18: 265000, 19: 305000, 20: 355000}
  # The uses of Action Surge and Indomitable by fighter level (pp. 24–25).
  action-surge-uses: {0: 0, 2: 1, 17: 2}
  indomitable-uses: {0: 0, 9: 1, 13: 2, 17: 3}
  # Paladins and rangers cast from 2nd level (pp. 31, 36): before it a class's spellcasting formulas have no value.
  half-caster-start: {2: 0}
  # The Multiclass Spellcaster table (p. 58), by caster level; for a single class it gives the class's own table.
  slots-1-by-caster-level: {1: 2, 2: 3, 3: 4}
  slots-2-by-caster-level: {3: 2, 4: 3}
  slots-3-by-caster-level: {5: 2, 6: 3}
  slots-4-by-caster-level: {7: 1, 8: 2, 9: 3}
  slots-5-by-caster-level: {9: 1, 10: 2, 18: 3}
  slots-6-by-caster-level: {11: 1, 19: 2}
  slots-7-by-caster-level: {13: 1, 20: 2}
  slots-8-by-caster-level: {15: 1}
  slots-9-by-caster-level: {17: 1}
# What the system works out from the sheet (D-199): ability modifiers (p. 76), the proficiency bonus (p. 56), saving throws (p. 83), skills with proficiency
# and expertise, which doubles a proficiency the character has (pp. 77–78, 13, 39), initiative, a Dexterity check (p. 90), and the passive Perception, Insight
# and Investigation (p. 78, D-218). A field with several formulas takes the first that has a value (D-210): the total a creature's stat block lists in saves
# and skills, such as Perception +3 (p. 254), also for a creature or companion that has a level; then a character's, which needs a level; then a creature's own. A character's adds what its features give (D-222): Jack of All
# Trades, half the proficiency bonus rounded down to a check without it (p. 12); Remarkable Athlete, half rounded up to a Strength, Dexterity or Constitution
# check without it, the larger of the two when both apply (p. 25); Aura of Protection, the Charisma modifier, at least 1, to its own saves (p. 32).
computed:
  str-mod: floor((str - 10) / 2)
  dex-mod: floor((dex - 10) / 2)
  con-mod: floor((con - 10) / 2)
  int-mod: floor((int - 10) / 2)
  wis-mod: floor((wis - 10) / 2)
  cha-mod: floor((cha - 10) / 2)
  level: sum(classes)
  proficiency: table(proficiency-by-level, level)
  str-save:
    - item(saves, Str) / has(saves, Str) + bonus-saves
    - str-mod + proficiency * has(save-proficiencies, str) + has(features, Aura of Protection) * max(1, cha-mod) + bonus-saves
    - str-mod + bonus-saves
  dex-save:
    - item(saves, Dex) / has(saves, Dex) + bonus-saves
    - dex-mod + proficiency * has(save-proficiencies, dex) + has(features, Aura of Protection) * max(1, cha-mod) + bonus-saves
    - dex-mod + bonus-saves
  con-save:
    - item(saves, Con) / has(saves, Con) + bonus-saves
    - con-mod + proficiency * has(save-proficiencies, con) + has(features, Aura of Protection) * max(1, cha-mod) + bonus-saves
    - con-mod + bonus-saves
  int-save:
    - item(saves, Int) / has(saves, Int) + bonus-saves
    - int-mod + proficiency * has(save-proficiencies, int) + has(features, Aura of Protection) * max(1, cha-mod) + bonus-saves
    - int-mod + bonus-saves
  wis-save:
    - item(saves, Wis) / has(saves, Wis) + bonus-saves
    - wis-mod + proficiency * has(save-proficiencies, wis) + has(features, Aura of Protection) * max(1, cha-mod) + bonus-saves
    - wis-mod + bonus-saves
  cha-save:
    - item(saves, Cha) / has(saves, Cha) + bonus-saves
    - cha-mod + proficiency * has(save-proficiencies, cha) + has(features, Aura of Protection) * max(1, cha-mod) + bonus-saves
    - cha-mod + bonus-saves
  acrobatics:
    - item(skills, Acrobatics) / has(skills, Acrobatics) + bonus-skills
    - dex-mod + proficiency * has(skill-proficiencies, Acrobatics) * (1 + has(expertise, Acrobatics)) + (1 - has(skill-proficiencies, Acrobatics)) * max(floor(proficiency / 2) * has(features, Jack of All Trades), ceil(proficiency / 2) * has(features, Remarkable Athlete)) + bonus-skills
    - dex-mod + bonus-skills
  animal-handling:
    - item(skills, Animal Handling) / has(skills, Animal Handling) + bonus-skills
    - wis-mod + proficiency * has(skill-proficiencies, Animal Handling) * (1 + has(expertise, Animal Handling)) + (1 - has(skill-proficiencies, Animal Handling)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - wis-mod + bonus-skills
  arcana:
    - item(skills, Arcana) / has(skills, Arcana) + bonus-skills
    - int-mod + proficiency * has(skill-proficiencies, Arcana) * (1 + has(expertise, Arcana)) + (1 - has(skill-proficiencies, Arcana)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - int-mod + bonus-skills
  athletics:
    - item(skills, Athletics) / has(skills, Athletics) + bonus-skills
    - str-mod + proficiency * has(skill-proficiencies, Athletics) * (1 + has(expertise, Athletics)) + (1 - has(skill-proficiencies, Athletics)) * max(floor(proficiency / 2) * has(features, Jack of All Trades), ceil(proficiency / 2) * has(features, Remarkable Athlete)) + bonus-skills
    - str-mod + bonus-skills
  deception:
    - item(skills, Deception) / has(skills, Deception) + bonus-skills
    - cha-mod + proficiency * has(skill-proficiencies, Deception) * (1 + has(expertise, Deception)) + (1 - has(skill-proficiencies, Deception)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - cha-mod + bonus-skills
  history:
    - item(skills, History) / has(skills, History) + bonus-skills
    - int-mod + proficiency * has(skill-proficiencies, History) * (1 + has(expertise, History)) + (1 - has(skill-proficiencies, History)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - int-mod + bonus-skills
  insight:
    - item(skills, Insight) / has(skills, Insight) + bonus-skills
    - wis-mod + proficiency * has(skill-proficiencies, Insight) * (1 + has(expertise, Insight)) + (1 - has(skill-proficiencies, Insight)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - wis-mod + bonus-skills
  intimidation:
    - item(skills, Intimidation) / has(skills, Intimidation) + bonus-skills
    - cha-mod + proficiency * has(skill-proficiencies, Intimidation) * (1 + has(expertise, Intimidation)) + (1 - has(skill-proficiencies, Intimidation)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - cha-mod + bonus-skills
  investigation:
    - item(skills, Investigation) / has(skills, Investigation) + bonus-skills
    - int-mod + proficiency * has(skill-proficiencies, Investigation) * (1 + has(expertise, Investigation)) + (1 - has(skill-proficiencies, Investigation)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - int-mod + bonus-skills
  medicine:
    - item(skills, Medicine) / has(skills, Medicine) + bonus-skills
    - wis-mod + proficiency * has(skill-proficiencies, Medicine) * (1 + has(expertise, Medicine)) + (1 - has(skill-proficiencies, Medicine)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - wis-mod + bonus-skills
  nature:
    - item(skills, Nature) / has(skills, Nature) + bonus-skills
    - int-mod + proficiency * has(skill-proficiencies, Nature) * (1 + has(expertise, Nature)) + (1 - has(skill-proficiencies, Nature)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - int-mod + bonus-skills
  perception:
    - item(skills, Perception) / has(skills, Perception) + bonus-skills
    - wis-mod + proficiency * has(skill-proficiencies, Perception) * (1 + has(expertise, Perception)) + (1 - has(skill-proficiencies, Perception)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - wis-mod + bonus-skills
  performance:
    - item(skills, Performance) / has(skills, Performance) + bonus-skills
    - cha-mod + proficiency * has(skill-proficiencies, Performance) * (1 + has(expertise, Performance)) + (1 - has(skill-proficiencies, Performance)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - cha-mod + bonus-skills
  persuasion:
    - item(skills, Persuasion) / has(skills, Persuasion) + bonus-skills
    - cha-mod + proficiency * has(skill-proficiencies, Persuasion) * (1 + has(expertise, Persuasion)) + (1 - has(skill-proficiencies, Persuasion)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - cha-mod + bonus-skills
  religion:
    - item(skills, Religion) / has(skills, Religion) + bonus-skills
    - int-mod + proficiency * has(skill-proficiencies, Religion) * (1 + has(expertise, Religion)) + (1 - has(skill-proficiencies, Religion)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - int-mod + bonus-skills
  sleight-of-hand:
    - item(skills, Sleight of Hand) / has(skills, Sleight of Hand) + bonus-skills
    - dex-mod + proficiency * has(skill-proficiencies, Sleight of Hand) * (1 + has(expertise, Sleight of Hand)) + (1 - has(skill-proficiencies, Sleight of Hand)) * max(floor(proficiency / 2) * has(features, Jack of All Trades), ceil(proficiency / 2) * has(features, Remarkable Athlete)) + bonus-skills
    - dex-mod + bonus-skills
  stealth:
    - item(skills, Stealth) / has(skills, Stealth) + bonus-skills
    - dex-mod + proficiency * has(skill-proficiencies, Stealth) * (1 + has(expertise, Stealth)) + (1 - has(skill-proficiencies, Stealth)) * max(floor(proficiency / 2) * has(features, Jack of All Trades), ceil(proficiency / 2) * has(features, Remarkable Athlete)) + bonus-skills
    - dex-mod + bonus-skills
  survival:
    - item(skills, Survival) / has(skills, Survival) + bonus-skills
    - wis-mod + proficiency * has(skill-proficiencies, Survival) * (1 + has(expertise, Survival)) + (1 - has(skill-proficiencies, Survival)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - wis-mod + bonus-skills
  initiative:
    - dex-mod + max(floor(proficiency / 2) * has(features, Jack of All Trades), ceil(proficiency / 2) * has(features, Remarkable Athlete)) + bonus-initiative
    - dex-mod + bonus-initiative
  passive-perception: 10 + perception
  passive-insight: 10 + insight
  passive-investigation: 10 + investigation
  # Jumping, pushing and holding one's breath (pp. 75, 80, 183; D-449), for a character with classes: a running long jump of Strength feet, a running high
  # jump of 3 + its modifier, standing half of each; pushing, dragging or lifting 30 times Strength, by size; holding one's breath 1 + Constitution modifier
  # minutes, at least 30 seconds.
  long-jump: str / min(1, count(classes))
  high-jump: max(0, 3 + str-mod) / min(1, count(classes))
  push-drag: ["str * 30 * table(carry-by-size, size) / min(1, count(classes))", "str * 30 / min(1, count(classes))"]
  hold-breath: max(0.5, 1 + con-mod) / min(1, count(classes))
  # The speeds (D-445, SPD-2, SPD-3): the written one, plus what adds (effects on bonus-speed, Fast Movement without heavy armor, Unarmored Movement
  # without armor or shield, minus a heavy armor without its Strength and the load under the rigor simulation: past Str×5 10 ft, past Str×10 20 more), times
  # the factors (effects on speed-factor, exhaustion 2 halves), under the cap of a load past its limit under the rigor rules (5 ft), and nothing at
  # exhaustion 5 or under a condition that stops one. A rogue with Second-Story Work climbs at walking speed.
  walking: "min(5 + 10000 * (1 - has(rigor, rules) * min(1, max(0, ceil(best(load, 0) - best(load-limit, 0)))) * min(1, best(load-limit, 0))), max(0, (speed + bonus-speed - speed-slowed - has(rigor, simulation) * (10 * min(1, max(0, ceil(best(load, 0) - 5 * best(str, 0)))) + 10 * min(1, max(0, ceil(best(load, 0) - 10 * best(str, 0))))) + 10 * has(features, Fast Movement) * (1 - min(1, count(equipped, category = heavy armor))) + best(unarmored-movement, 0) * (1 - min(1, count(equipped, category = light armor) + count(equipped, category = medium armor) + count(equipped, category = heavy armor) + count(equipped, category = shield)))) * speed-factor / (1 + min(1, max(0, best(exhaustion, 0) - 1))) * (1 - min(1, max(0, best(exhaustion, 0) - 4) + has(effects, Grappled) + has(effects, Restrained) + has(effects, Paralyzed) + has(effects, Petrified) + has(effects, Stunned) + has(effects, Unconscious)))))"
  flying: "min(5 + 10000 * (1 - has(rigor, rules) * min(1, max(0, ceil(best(load, 0) - best(load-limit, 0)))) * min(1, best(load-limit, 0))), max(0, (fly + bonus-speed - speed-slowed - has(rigor, simulation) * (10 * min(1, max(0, ceil(best(load, 0) - 5 * best(str, 0)))) + 10 * min(1, max(0, ceil(best(load, 0) - 10 * best(str, 0))))) + 10 * has(features, Fast Movement) * (1 - min(1, count(equipped, category = heavy armor))) + best(unarmored-movement, 0) * (1 - min(1, count(equipped, category = light armor) + count(equipped, category = medium armor) + count(equipped, category = heavy armor) + count(equipped, category = shield)))) * speed-factor / (1 + min(1, max(0, best(exhaustion, 0) - 1))) * (1 - min(1, max(0, best(exhaustion, 0) - 4) + has(effects, Grappled) + has(effects, Restrained) + has(effects, Paralyzed) + has(effects, Petrified) + has(effects, Stunned) + has(effects, Unconscious)))))"
  swimming: "min(5 + 10000 * (1 - has(rigor, rules) * min(1, max(0, ceil(best(load, 0) - best(load-limit, 0)))) * min(1, best(load-limit, 0))), max(0, (swim + bonus-speed - speed-slowed - has(rigor, simulation) * (10 * min(1, max(0, ceil(best(load, 0) - 5 * best(str, 0)))) + 10 * min(1, max(0, ceil(best(load, 0) - 10 * best(str, 0))))) + 10 * has(features, Fast Movement) * (1 - min(1, count(equipped, category = heavy armor))) + best(unarmored-movement, 0) * (1 - min(1, count(equipped, category = light armor) + count(equipped, category = medium armor) + count(equipped, category = heavy armor) + count(equipped, category = shield)))) * speed-factor / (1 + min(1, max(0, best(exhaustion, 0) - 1))) * (1 - min(1, max(0, best(exhaustion, 0) - 4) + has(effects, Grappled) + has(effects, Restrained) + has(effects, Paralyzed) + has(effects, Petrified) + has(effects, Stunned) + has(effects, Unconscious)))))"
  climbing: ["min(5 + 10000 * (1 - has(rigor, rules) * min(1, max(0, ceil(best(load, 0) - best(load-limit, 0)))) * min(1, best(load-limit, 0))), max(0, (climb + bonus-speed - speed-slowed - has(rigor, simulation) * (10 * min(1, max(0, ceil(best(load, 0) - 5 * best(str, 0)))) + 10 * min(1, max(0, ceil(best(load, 0) - 10 * best(str, 0))))) + 10 * has(features, Fast Movement) * (1 - min(1, count(equipped, category = heavy armor))) + best(unarmored-movement, 0) * (1 - min(1, count(equipped, category = light armor) + count(equipped, category = medium armor) + count(equipped, category = heavy armor) + count(equipped, category = shield)))) * speed-factor / (1 + min(1, max(0, best(exhaustion, 0) - 1))) * (1 - min(1, max(0, best(exhaustion, 0) - 4) + has(effects, Grappled) + has(effects, Restrained) + has(effects, Paralyzed) + has(effects, Petrified) + has(effects, Stunned) + has(effects, Unconscious)))))", "walking * has(features, Second-Story Work) / has(features, Second-Story Work)"]
  burrowing: "min(5 + 10000 * (1 - has(rigor, rules) * min(1, max(0, ceil(best(load, 0) - best(load-limit, 0)))) * min(1, best(load-limit, 0))), max(0, (burrow + bonus-speed - speed-slowed - has(rigor, simulation) * (10 * min(1, max(0, ceil(best(load, 0) - 5 * best(str, 0)))) + 10 * min(1, max(0, ceil(best(load, 0) - 10 * best(str, 0))))) + 10 * has(features, Fast Movement) * (1 - min(1, count(equipped, category = heavy armor))) + best(unarmored-movement, 0) * (1 - min(1, count(equipped, category = light armor) + count(equipped, category = medium armor) + count(equipped, category = heavy armor) + count(equipped, category = shield)))) * speed-factor / (1 + min(1, max(0, best(exhaustion, 0) - 1))) * (1 - min(1, max(0, best(exhaustion, 0) - 4) + has(effects, Grappled) + has(effects, Restrained) + has(effects, Paralyzed) + has(effects, Petrified) + has(effects, Stunned) + has(effects, Unconscious)))))"
  # The armor class (p. 63, D-231): with armor, the armor's and the shield's, with Defense (p. 24); without, the best of 10 + Dex, as the game is played
  # (the SRD 5.1 does not write it), what a class gives, as Unarmored Defense (pp. 8, 26), the first class's (p. 57), or Draconic Resilience (p. 45), and
  # Mage Armor (p. 160), with the shield; and what effects add. Only a character with classes: a creature, or a companion with a level and no classes,
  # keeps the AC of its stat block.
  ac:
    - armor-class + armor-class-bonus + has(fighting-styles, Defense) + bonus-ac
    - best((10 + dex-mod) / min(1, count(classes)), unarmored-base + dex-mod, unarmored-ac) + armor-class-bonus + bonus-ac
  # The caster level for spell slots (p. 58): every level in a full caster's class, half in a half caster's, rounded down; with a single spellcasting
  # class, a half caster's is its own table, rounded up from 2nd level. No value without a spellcasting class, so no slots. A paladin and a ranger together
  # count half the sum of their levels, as p. 58 reads (half of each, rounded down, is another reading).
  caster-level: "(sum(classes, spellcasting = full) + floor(sum(classes, spellcasting = half) / 2) + (min(1, count(classes, spellcasting = full) + count(classes, spellcasting = half)) - min(1, max(0, count(classes, spellcasting = full) + count(classes, spellcasting = half) - 1))) * (ceil(sum(classes, spellcasting = half) / 2) - floor(sum(classes, spellcasting = half) / 2)) * min(1, floor(sum(classes, spellcasting = half) / 2))) / min(1, count(classes, spellcasting = full) + count(classes, spellcasting = half))"
# The hit point maximum (each class's Hit Points, pp. 8–55; p. 56): what the dice gave, and at every level the Constitution modifier, which follows it when it changes, and the hit
# points a race adds; at every sorcerer level the Draconic Bloodline's hit point (p. 45). A hit die for each level in a class, of that class's die, counted
# only for a character with classes, from the die its page writes, of the system or the campaign (p. 56, D-215); inspiration, which a character has or has not (p. 60).
# Exhaustion 4 halves the hit point maximum (p. 358).
counters:
  hp: {max: "floor((hp-base + level * (con-mod + hp-per-level) + has(subclasses, Draconic Bloodline) * item(classes, Sorcerer)) / (1 + min(1, max(0, best(exhaustion, 0) - 3))))"}
  # Damage takes temporary hit points first (p. 98, D-266, DAT-14).
  temp-hp: {shields: hp}
  hit-dice-d6: {max: "sum(classes, hit-die = d6)"}
  hit-dice-d8: {max: "sum(classes, hit-die = d8)"}
  hit-dice-d10: {max: "sum(classes, hit-die = d10)"}
  hit-dice-d12: {max: "sum(classes, hit-die = d12)"}
  inspiration: {max: 1}
  # The uses of features (D-204, D-220), from their class's table or text, and the rest that brings them back (pp. 8–55). Rages, ki points and sorcery points
  # take their maximum from the class's row; Channel Divinity counts once from two classes (p. 57), and a paladin has it from the Sacred Oath (p. 32); a bard's inspiration comes back with a short rest from
  # Font of Inspiration, and a sorcerer at 20th level regains 4 sorcery points with one. A race's uses are written on its page, such as Breath Weapon.
  rages: {refill: long rest}
  ki-points: {refill: short rest}
  sorcery-points: {refill: {long rest: max, short rest: "4 * has(features, Sorcerous Restoration)"}}
  bardic-inspiration: {max: "has(features, Bardic Inspiration) * max(1, cha-mod)", refill: {long rest: max, short rest: "max * has(features, Font of Inspiration)"}}
  channel-divinity: {max: "max(item(features, Channel Divinity), has(features, Channel Divinity), has(features, Sacred Oath))", refill: short rest}
  action-surge: {max: "table(action-surge-uses, item(classes, Fighter))", refill: short rest}
  second-wind: {max: "has(features, Second Wind)", refill: short rest}
  indomitable: {max: "table(indomitable-uses, item(classes, Fighter))", refill: long rest}
  wild-shape: {max: "2 * has(features, Wild Shape) * (1 - has(features, Archdruid))", refill: short rest}
  divine-sense: {max: "has(features, Divine Sense) * (1 + cha-mod)", refill: long rest}
  lay-on-hands: {max: "5 * item(classes, Paladin)", refill: long rest}
  cleansing-touch: {max: "has(features, Cleansing Touch) * max(1, cha-mod)", refill: long rest}
  arcane-recovery: {max: "has(features, Arcane Recovery)", refill: long rest}
  natural-recovery: {max: "has(features, Natural Recovery)", refill: long rest}
  wholeness-of-body: {max: "has(features, Wholeness of Body)", refill: long rest}
  holy-nimbus: {max: "has(features, Holy Nimbus)", refill: long rest}
  dark-ones-own-luck: {max: "has(features, Dark One's Own Luck)", refill: short rest}
  hurl-through-hell: {max: "has(features, Hurl Through Hell)", refill: long rest}
  stroke-of-luck: {max: "has(features, Stroke of Luck)", refill: short rest}
  eldritch-master: {max: "has(features, Eldritch Master)", refill: long rest}
  breath-weapon: {refill: short rest}
  relentless-endurance: {refill: long rest}
  # Spell slots by caster level (p. 58); a warlock's Pact Magic slots from its table, back with a short rest (p. 47), and its Mystic Arcanum; a wizard's
  # two Signature Spells, each once a short rest (p. 54).
  slots-1: {max: "table(slots-1-by-caster-level, caster-level)"}
  slots-2: {max: "table(slots-2-by-caster-level, caster-level)"}
  slots-3: {max: "table(slots-3-by-caster-level, caster-level)"}
  slots-4: {max: "table(slots-4-by-caster-level, caster-level)"}
  slots-5: {max: "table(slots-5-by-caster-level, caster-level)"}
  slots-6: {max: "table(slots-6-by-caster-level, caster-level)"}
  slots-7: {max: "table(slots-7-by-caster-level, caster-level)"}
  slots-8: {max: "table(slots-8-by-caster-level, caster-level)"}
  slots-9: {max: "table(slots-9-by-caster-level, caster-level)"}
  spell-slots: {refill: short rest}
  # Mystic Arcanum: one spell of each level, 6th to 9th, from the 11th, 13th, 15th and 17th warlock level, each once a long rest (p. 49).
  mystic-arcanum-6: {max: "min(1, floor(item(classes, Warlock) / 11))", refill: long rest}
  mystic-arcanum-7: {max: "min(1, floor(item(classes, Warlock) / 13))", refill: long rest}
  mystic-arcanum-8: {max: "min(1, floor(item(classes, Warlock) / 15))", refill: long rest}
  mystic-arcanum-9: {max: "min(1, floor(item(classes, Warlock) / 17))", refill: long rest}
  # Signature Spells: two 3rd-level spells, each once a short rest (p. 54).
  signature-spell-1: {max: "has(features, Signature Spells)", refill: short rest}
  signature-spell-2: {max: "has(features, Signature Spells)", refill: short rest}
