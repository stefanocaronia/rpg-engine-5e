    - wis-mod + proficiency * has(skill-proficiencies, Insight) * (1 + has(expertise, Insight)) + (1 - has(skill-proficiencies, Insight)) * floor(proficiency / 2) * has(features, Jack of All Trades) + bonus-skills
    - wis-mod + bonus-skills
  intimidation:
