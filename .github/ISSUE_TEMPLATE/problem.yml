name: Something went wrong
description: A rule ruled wrong, a sheet's number that is off, a page of the SRD 5.1 that is wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: This system holds only the SRD 5.1, the open part of fifth edition. Content from the books, such as other subclasses, feats or monsters, cannot be added here; your master can write it into your campaign from a book you own.
  - type: textarea
    id: did
    attributes:
      label: What you did
      description: The steps, or what you wrote to the master. Leave out your campaign's secrets if you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The rule as the SRD says it, if you know where.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you saw, with the exact message if there was one. A screenshot of the dashboard helps.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: What `rpg --version` and `rpg package list` print, such as rpg-engine 0.19.1 with @rpgengine/system-5e 0.16.1.
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Your AI agent and model
      description: Such as Claude Code with Opus, or Codex with GPT-5.
    validations:
      required: true
